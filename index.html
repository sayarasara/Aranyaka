    <script>
        // Task data from the provided image
        const tasks = [
            {
                company: "ShopEase",
                title: "Fix Mobile Button Issue",
                description: "Debug using Chrome DevTools, Check for overlapping elements...",
                deadline: "21 March 2025",
                completed: false
            },
            {
                company: "CloudSync",
                title: "Add Dark Mode",
                description: "Store the users preference in localstorage, update css",
                deadline: "21 March 2025",
                completed: false
            },
            {
                company: "ShopEase",
                title: "Fix Mobile Button Issue",
                description: "Debug using Chrome DevTools, Check for overlapping elements...",
                deadline: "21 March 2025",
                completed: false
            },
            {
                company: "Meta",
                title: "Add new emoji",
                description: "Debug using Chrome DevTools, Check for overlapping elements...",
                deadline: "21 March 2025",
                completed: false
            },
            {
                company: "Google LLC",
                title: "Integrate OpenAI API",
                description: "Debug using Chrome DevTools, Check for overlapping elements...",
                deadline: "21 March 2025",
                completed: false
            },
            {
                company: "Glassdoor",
                title: "Improve Job searching",
                description: "Debug using Chrome DevTools, Check for overlapping elements...",
                deadline: "21 March 2025",
                completed: false
            }
        ];

        // Initialize activity log from localStorage or empty array
        let activityLog = JSON.parse(localStorage.getItem('devBoardActivityLog')) || [];

        // Function to render tasks
        function renderTasks() {
            const tasksContainer = document.getElementById('tasksContainer');
            tasksContainer.innerHTML = '';
            
            // Update task count
            const activeTasks = tasks.filter(t => !t.completed).length;
            document.getElementById('tasksAssignedCount').textContent = activeTasks;
            
            tasks.forEach((task, index) => {
                const taskCard = document.createElement('div');
                taskCard.className = `card bg-blue-200 shadow-md task-card ${task.completed ? 'completed-task' : ''}`;
                taskCard.innerHTML = `
                    <div class="card-body">
                        <div class="badge badge-outline badge-primary mb-2">${task.company}</div>
                        <h3 class="card-title text-lg">${task.title}</h3>
                        <p class="text-sm opacity-70 mb-4">${task.description}</p>
                        <div class="card-actions justify-between items-center">
                            <div>
                                <p class="text-xs font-semibold">Deadline</p>
                                <p class="text-sm">${task.deadline}</p>
                            </div>
                            <button class="btn ${task.completed ? 'btn-success' : 'btn-primary'} btn-sm" 
                                    onclick="completeTask(${index})" 
                                    ${task.completed ? 'disabled' : ''}>
                                ${task.completed ? 'Completed' : 'Complete'}
                            </button>
                        </div>
                    </div>
                `;
                tasksContainer.appendChild(taskCard);
            });
        }

        // Function to complete a task
        function completeTask(index) {
            if (index >= 0 && index < tasks.length) {
                tasks[index].completed = true;
                
                // Add to activity log
                const activity = {
                    task: tasks[index].title,
                    company: tasks[index].company,
                    timestamp: new Date().toLocaleString(),
                    type: 'completed'
                };
                
                activityLog.unshift(activity); // Add to beginning of array
                localStorage.setItem('devBoardActivityLog', JSON.stringify(activityLog));
                
                // Update UI
                renderTasks();
                renderActivityLog();
            }
        }

        // Function to render activity log
        function renderActivityLog() {
            const activityLogContainer = document.getElementById('activityLog');
            activityLogContainer.innerHTML = '';
            
            if (activityLog.length === 0) {
                activityLogContainer.innerHTML = '<p class="text-center text-gray-500 py-4">No activity yet</p>';
                return;
            }
            
            activityLog.forEach(activity => {
                const activityItem = document.createElement('div');
                activityItem.className = 'flex gap-3 py-3 border-b border-gray-200 last:border-b-0';
                activityItem.innerHTML = `
                    <div class="flex-shrink-0 w-2 bg-green-500 rounded-full"></div>
                    <div class="flex-1">
                        <p class="font-semibold">${activity.task}</p>
                        <p class="text-sm text-gray-500">${activity.company} • ${activity.timestamp}</p>
                    </div>
                `;
                activityLogContainer.appendChild(activityItem);
            });
        }

        // Function to clear activity log
        function clearActivityLog() {
            activityLog = [];
            localStorage.setItem('devBoardActivityLog', JSON.stringify(activityLog));
            renderActivityLog();
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            // Set up event listeners
            document.getElementById('clearHistoryBtn').addEventListener('click', clearActivityLog);
            
            // Render initial content
            renderTasks();
            renderActivityLog();
            
            // Background color change on click (as in original code)
            document.body.addEventListener('click', function(e) {
                // Don't change color when clicking buttons
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
                
                let colors = ['#dbeafe', '#fef3c7', '#fce7f3', '#dcfce7', '#f3e8ff'];
                let randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                let oldBg = this.style.backgroundColor;
                this.style.backgroundColor = randomColor;
                
                setTimeout(() => {
                    this.style.backgroundColor = '#dbeafe';
                }, 1000);
            });
        });
    </script>
